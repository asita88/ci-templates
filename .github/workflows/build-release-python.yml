name: Build and Release (Python)

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      healthcheck_url:
        required: false
        type: string
        default: ''
      build_script:
        required: false
        type: string
        default: 'scripts/build.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          BRANCH=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')
          DATE=$(date +%Y%m%d)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ARTIFACT_NAME=${{ inputs.app_name }}-${BRANCH}-${SHA}-"at"-${DATE}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Build
        env:
          APP_NAME: ${{ inputs.app_name }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          DATE: ${{ steps.version.outputs.date }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          mkdir -p release
          BUILD_SCRIPT='${{ inputs.build_script }}'
          if [ -f "$BUILD_SCRIPT" ]; then
            chmod +x "$BUILD_SCRIPT"
            APP_DIR="/opt/${{ inputs.app_name }}" APP_NAME='${{ inputs.app_name }}' "$BUILD_SCRIPT"
          else
            tar --exclude=./release --exclude=./.git --exclude=./venv --exclude=./.github -cf - . | tar -xf - -C release
          fi
          if [ -f scripts/deploy.sh ]; then
            cp -f scripts/deploy.sh release/deploy.sh
            chmod +x release/deploy.sh
          fi

      - name: Create release archive
        run: tar -czf ${{ steps.version.outputs.artifact_name }}.tar.gz -C release .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.artifact_name }}.tar.gz
          retention-days: 1

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.artifact_name }}.tar.gz
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.app_name }} ${{ github.ref_name }}
          body: |
            ## ${{ inputs.app_name }} ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.app_name }}-production
      cancel-in-progress: true
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "${{ needs.build.outputs.artifact_name }}.tar.gz"
          target: "/tmp"

      - name: Extract and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_ROOT="/opt/${{ inputs.app_name }}"
            ARTIFACT_NAME='${{ needs.build.outputs.artifact_name }}'
            echo "[deploy] app=${{ inputs.app_name }} artifact=$ARTIFACT_NAME host=$(hostname) at=$(date -Is)"
            mkdir -p "$APP_ROOT"
            tar -xzf /tmp/"$ARTIFACT_NAME.tar.gz" -C "$APP_ROOT"
            rm -f /tmp/"$ARTIFACT_NAME.tar.gz"
            cd "$APP_ROOT"
            if [ -f "$APP_ROOT/deploy.sh" ]; then
              chmod +x "$APP_ROOT/deploy.sh"
              APP_DIR="$APP_ROOT" APP_NAME='${{ inputs.app_name }}' "$APP_ROOT/deploy.sh"
            else
              supervisorctl restart ${{ inputs.app_name }} || true
            fi
            if [ -n "${{ inputs.healthcheck_url }}" ]; then
              for i in {1..30}; do
                curl -fsS "${{ inputs.healthcheck_url }}" >/dev/null && exit 0
                sleep 1
              done
              echo "healthcheck failed: ${{ inputs.healthcheck_url }}" 1>&2
              exit 1
            fi
